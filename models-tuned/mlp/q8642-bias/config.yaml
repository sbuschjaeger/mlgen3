quantization:
  use_matquant: true
  use_codistillation: false
  use_qat: false
  fx_mode: false
  target_bits:
  - 8
  - 6
  - 4
  - 2
  loss_weights:
    8: 0.2
    6: 0.4
    4: 0.6
    2: 0.8
  quantize_input: true
  quantize_bias: true
  quantize_weight: true
  quantize_activation: true
  quantize_signed: true
  fold_bn_inference: false
  quantized_params_list:
  - all
  use_bias: true
model:
  name: mlp
  dataset: mnist
  input_size: 28
  hidden_layers:
  - size: 512
  - size: 512
  output_size: 10
  use_hf: false
training:
  model_dir: ./models/mlp/matquant
  model_savename: q864_mq864_wab_s
  dry_iterations: 10
  optimizer: sgd
  batch_size: 256
  num_epochs: 30
  learning_rate: 0.001
  lr_scheduler: cosine
  gamma: 0.1
  step_size: 10
  momentum: 0.9
  weight_decay: 0.0001
  val_split: 0.1
  early_stopping:
    enabled: true
    monitor: test_accuracy
    patience: 5
    min_delta: 0.01
evaluation:
  model_path: ./models-tuned/mlp/q8642-bias/best_model.pt
  test_samples: 10000
  batch_size: 128
  num_iterations: 1
early_stopping_info:
  epoch: 22
  monitor: test_accuracy
  score: 94.1225
  mode: max
training_metrics:
  epoch_loss: 0.32
  val_loss: 0.67
  test_avg_accuracy: 94.12
  val_avg_accuracy: 93.37
  per_bit_metrics:
    8bit:
      train_loss: 0.16
      train_accuracy: 95.51
      test_top1_accuracy: 94.01
      test_top5_accuracy: 99.85
      test_accuracy: 94.01
      val_loss: 0.31
      val_accuracy: 93.33
    6bit:
      train_loss: 0.16
      train_accuracy: 95.5
      test_top1_accuracy: 94.12
      test_top5_accuracy: 99.86
      test_accuracy: 94.12
      val_loss: 0.31
      val_accuracy: 93.48
    4bit:
      train_loss: 0.16
      train_accuracy: 95.51
      test_top1_accuracy: 94.4
      test_top5_accuracy: 99.85
      test_accuracy: 94.4
      val_loss: 0.31
      val_accuracy: 93.5
    2bit:
      train_loss: 0.17
      train_accuracy: 95.25
      test_top1_accuracy: 93.96
      test_top5_accuracy: 99.78
      test_accuracy: 93.96
      val_loss: 0.36
      val_accuracy: 93.15
