quantization:
  use_matquant: True
  use_codistillation: False

  use_qat: False
  fx_mode: False
  
  target_bits: [8, 4, 2]
  loss_weights: {8: 0.4, 4: 0.8, 2: 0.8}

  quantize_bias: True
  quantize_target: "weights_and_activations"  # Options: "weights_only", "activations_only", "weights_and_activations"
  
  quantize_signed: False # Whether to use signed quantization (default: False for unsigned)
       
  quantize_layers: ["all"]

  # ## for evaluating multiple (also untrained) bit-widths
  # target_bits: [8, 7, 6, 5, 4, 3, 2, 1]
  # loss_weights: {8: 0.4, 7: 0.0, 6: 0.0, 5: 0.0, 4: 0.8, 3: 0.0, 2: 0.8, 1: 0.0}

  # # Use --list-layers to get id and path of layers
  # # Index-based selection (less robust)
  # quantize_layers: [0, 1, 2, 3, 4, 5, 6, 7]

  ## 4, 5, 6 <=> 14.w, 18.w, 22.w very sensitive, if they are quantized, the model will go to 10%

  # # Note that only a single model. prefix needs to be specified (--list-layers will show the full path)
  # # Path-based selection (more robust)
  # quantize_layers:
  #   - "model.0.weight"
  #   - "model.4.weight"
  #   - "model.8.weight"
  #   - "model.12.weight"
  #   - "model.17.weight"
  #   - "model.19.weight"

model:
  name: vgg8
  dataset: cifar10
  num_channels: 3
  num_blocks: 3  # Number of VGG blocks (Conv+Max+Act and/or Conv+Act)
  kernel_size: 3
  stride: 1
  padding: 1
  input_size: 32
  linear_layers:
    - size: 1024
  num_classes: 10

training:
  model_dir: ./models/vgg/cifar10/matquant
  model_savename: q842_mq842_wab
  optimizer: sgd
  batch_size: 64
  num_epochs: 1
  learning_rate: 0.01
  lr_scheduler: step
  gamma: 0.1
  step_size: 10
  momentum: 0.9
  weight_decay: 0.0001
  seed: 707  # Random seed for reproducibility

evaluation:
  model_path: ./models/vgg/cifar10/matquant/q842_mq842_wab.pt
  
  test_samples: 100
  batch_size: 128
  num_iterations: 1

  mix_and_match_configs:
    - description: "Bit-Widths: [8, 4, 2]; Threshold: 2.0; injection rates: [0.0001, 0.001, 0.01, 0.1, 0.2, 0.5]"
      config: {"model.0.weight": 8, "model.0.bias": 8, "model.4.weight": 4, "model.4.bias": 4, "model.7.weight": 8, "model.7.bias": 8, "model.11.weight": 4, "model.11.bias": 4, "model.14.weight": 2, "model.14.bias": 2, "model.18.weight": 2, "model.18.bias": 2, "model.22.weight": 8, "model.22.bias": 8, "model.24.weight": 8, "model.24.bias": 8}
