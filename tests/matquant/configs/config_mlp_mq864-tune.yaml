quantization:
  use_matquant: True
  use_codistillation: False

  use_qat: False
  fx_mode: False
  
  target_bits: [8, 6, 4]
  loss_weights: {8: 0.2, 6: 0.6, 4: 0.8}

  quantize_input: True        # Enable 8-bit input quantization
  quantize_bias: True         # Note that biases are quantized to 32-bits only
  quantize_weight: True
  quantize_activation: True   # Note that activations are quantized to 8-bits only
  quantize_signed: True       # Whether to use signed quantization
  fold_bn_inference: False    # Fold BatchNorm into Conv/Linear during inference

  quantized_params_list: ["all"]
  # quantized_params_list: [
  #   "model.0.weight", #0
  #   "model.0.bias",   #1
  #   "model.2.weight", #2
  #   "model.2.bias",   #3
  #   "model.4.weight", #4
  #   "model.4.bias"    #5
  # ]

model:
  name: mlp
  dataset: mnist
  input_size: 28
  hidden_layers:
    - size: 512
    - size: 512
  output_size: 10

training:
  model_dir: ./models/mlp/matquant
  model_savename: q864_mq864_wab_s-best
  dry_iterations: 5
  optimizer: sgd
  batch_size: 256
  num_epochs: 20
  learning_rate: 0.01
  lr_scheduler: cosine
  gamma: 0.1
  step_size: 20
  momentum: 0.9
  weight_decay: 0.0001
  
  # Early stopping parameters
  val_split: 0.1  # 10% of training data for validation
  early_stopping:
    enabled: True
    monitor: 'test_accuracy'  # Options: 'val_loss' (min), 'val_accuracy' (max), 'test_accuracy' (max), 'epoch_loss' (min)
    patience: 5
    min_delta: 0.01

evaluation:
  model_path: ./models/mlp/matquant/q864_mq864_wab_s-best.pt
  batch_size: 128
  num_iterations: 1
