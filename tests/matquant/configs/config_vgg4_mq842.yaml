quantization:
  use_matquant: True
  use_codistillation: False

  use_qat: False
  fx_mode: False
  
  target_bits: [8, 4, 2]
  loss_weights: {8: 0.4, 4: 0.8, 2: 0.8}

  quantize_bias: True
  quantize_target: "weights_and_activations"  # Options: "weights_only", "activations_only", "weights_and_activations"
  
  quantize_signed: True # Whether to use signed quantization (default: False for unsigned)
        
  quantize_layers: ["all"]

model:
  name: vgg4
  dataset: fashion
  num_channels: 1
  num_blocks: 1  # Number of VGG blocks (Conv+Max+Act and/or Conv+Act)
  kernel_size: 3
  stride: 1
  padding: 1
  input_size: 28
  linear_layers:
    - size: 2048
  num_classes: 10

training:
  model_dir: ./models/vgg/fashion/matquant
  model_savename: q842_mq842_wab
  optimizer: sgd
  batch_size: 64
  num_epochs: 1
  learning_rate: 0.01
  lr_scheduler: cosine
  gamma: 0.1
  step_size: 5
  momentum: 0.9
  weight_decay: 0.0001
  seed: 707  # Random seed for reproducibility

evaluation:
  model_path: ./models/vgg/fashion/matquant/q842_mq842_wab.pt
  
  test_samples: 100
  batch_size: 128
  num_iterations: 1

  mix_and_match_configs:
    # - description: "weights_only conv+lin"
    #   config: {"model.0.weight": 8, "model.4.weight": 4, "model.9.weight": 2, "model.11.weight": 2}

    - description: "weights_and_biases conv+lin"
      config: {"model.0.weight": 8, "model.0.bias": 8, "model.4.weight": 4, "model.4.bias": 4, "model.9.weight": 2, "model.9.bias": 2, "model.11.weight": 2, "model.11.bias": 2}


